name: compatibility
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.23.2, 24.18.1, 26.5.1]
        pi: [0.84.3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm compat:install --pi ${{ matrix.pi }}
      - run: pnpm check:all
      - run: pnpm test:packed-pi

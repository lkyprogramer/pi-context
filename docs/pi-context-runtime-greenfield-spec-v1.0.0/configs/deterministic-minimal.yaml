profile: deterministic-minimal
compatibility:
  supportedPiRange: '>=0.84.3 <0.85.0'
  knownConflictPolicy: deny-known
  providerPayloadProbe: false
storage:
  requireFts5: false
  synchronous: FULL
  minimumFreeDiskBytes: 1073741824
  rawEvidenceRetentionDays: 30
  viewRetentionDays: 7
observation:
  failurePolicy: fail-closed
  maxVisibleTokens: 3000
  maxRawBytes: 67108864
  reducerTimeoutMs: 100
budget:
  targetRatio: 0.45
  softRatio: 0.65
  hardRatio: 0.85
  outputReserveTokens: 16384
  directiveMaxTokens: 12000
  activeTurnMinTokens: 8000
  historicalTailMaxTokens: 24000
retrieval:
  fts: false
  proactive: false
  proactiveBudgetTokens: 2000
  maxRecallTokens: 16000
  maxHits: 50
  leaseTokenTurnBudget: 8000
hostCompaction:
  enabled: true
  afterMessages: 500
  afterEstimatedTokens: 120000
  minimumShrinkRatio: 0.15
  settledOnly: true
semantic:
  enabled: false
  background: false
  maxConcurrentJobs: 0
  maxTokensPerJob: 0
  verifierRequired: true
security:
  strict: false
  trustedRpc: false
  actionGate: true
  secretScrub: true
  egressAllowlist: []

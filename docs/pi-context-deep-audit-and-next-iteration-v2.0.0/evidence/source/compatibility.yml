name: compatibility
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pi-matrix:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.18.1"]
        lane: [min, current]
        os: [ubuntu-latest, macos-latest]
        include:
          - node: "22.19.0"
            lane: latest
            os: ubuntu-latest
            advisory: true
          - node: "26.5.1"
            lane: current
            os: ubuntu-latest
            advisory: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Select Pi compatibility target
        run: node scripts/install-pi-version.mjs "${{ (matrix.lane == 'min' || matrix.lane == 'current') && '0.84.4' || 'latest' }}"
      - name: Package boundaries
        run: node scripts/ci/run-gate.mjs --name package-boundaries --log artifacts/ci/package-boundaries.log -- pnpm check:boundaries
      - name: Production package build
        run: node scripts/ci/run-gate.mjs --name package-build --log artifacts/ci/package-build.log -- pnpm vitest run tests/release/package-artifact.test.ts
      - name: Typecheck
        run: node scripts/ci/run-gate.mjs --name typecheck --log artifacts/ci/typecheck.log -- pnpm typecheck
      - name: Unit tests
        run: node scripts/ci/run-gate.mjs --name unit --log artifacts/ci/unit.log -- pnpm test
      - name: Acceptance tests
        run: node scripts/ci/run-gate.mjs --name acceptance --log artifacts/ci/acceptance.log -- pnpm vitest run tests/acceptance --passWithNoTests
      - name: Pi compatibility contract
        run: node scripts/ci/run-gate.mjs --name pi-contract --log artifacts/ci/pi-contract.log -- pnpm vitest run tests/compat/pi-version-contract.test.ts tests/compat/provider-payload-probe.test.ts tests/compat/matrix.test.ts
      - name: Public Pi import scan
        run: node scripts/ci/run-gate.mjs --name public-pi-imports --log artifacts/ci/public-pi-imports.log -- node scripts/check-public-pi-imports.mjs
      - name: Record compatibility cell
        if: always()
        run: node compat/matrix.mjs --workspace ci --node "${{ matrix.node }}" --os "${{ runner.os }}" --pi 0.84.4 --log-dir artifacts/ci --out "artifacts/compat/cell-${{ matrix.os }}-node-${{ matrix.node }}-${{ matrix.lane }}.json"
      - name: Upload CI gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gates-${{ matrix.os }}-node-${{ matrix.node }}-${{ matrix.lane }}
          path: |
            artifacts/ci/*.log
            artifacts/compat/*.json
          if-no-files-found: error
  compatibility-required:
    name: compatibility-required
    if: always()
    needs: pi-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require non-advisory matrix cells
        run: test "${{ needs.pi-matrix.result }}" != "failure"

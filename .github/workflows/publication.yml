name: publication
on:
  workflow_dispatch:
jobs:
  publication-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: test "$GITHUB_REF" = "refs/heads/main"
      - run: node scripts/ci/verify-protection.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/release/build-run-bundle.mjs
      - run: node scripts/release/secret-scan.mjs artifacts/runs/rc
      - run: node scripts/release/verify.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: pcr-rc-manifest
          path: |
            artifacts/runs/rc/manifest.json
            artifacts/runs/rc/raw-bundle.tar.gz

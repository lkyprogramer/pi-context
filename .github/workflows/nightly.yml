name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
concurrency:
  group: nightly-live
  cancel-in-progress: false
jobs:
  live-3-seed:
    environment: live
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        seed: [7, 11, 23]
    env:
      PCR_LIVE_PROVIDER_KEY: ${{ secrets.PCR_LIVE_PROVIDER_KEY }}
      PCR_LIVE_MODEL: ${{ secrets.PCR_LIVE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Live environment preflight
        run: mkdir -p artifacts/live && node scripts/ci/live-env.mjs --workspace live --seeds 7,11,23 --run-seed ${{ matrix.seed }} > "artifacts/live/preflight-seed-${{ matrix.seed }}.json"
      - name: Upload nightly seed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-seed-${{ matrix.seed }}
          path: artifacts/live/**
          if-no-files-found: error
          retention-days: 14
